[package]
name = "s33d-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
truck-modeling = "0.6"
truck-topology = "0.6"
truck-geometry = "0.5"
truck-stepio = { version = "0.3", features = ["in"] }
truck-meshalgo = { version = "0.4", default-features = true }
truck-polymesh = "0.6"
manifold-rust = "0.13"
glam = "0.29"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
gltf = "1.4"
flate2 = "1"
crc32fast = "1"
quick-xml = "0.41"

[dev-dependencies]
serde_json = "1"

[build-dependencies]
occt-sys = "=0.6.0"
cc = "1"
serde_json = "1"
